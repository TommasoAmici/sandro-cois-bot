name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --ignore-scripts --no-progress
      - run: bun test:ci
      - run: bun lint:check
      # - run: bun typecheck

  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
    outputs:
      skipped: ${{ steps.output_step.outputs.skipped }}
      version: ${{ steps.output_step.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-push: "false"
          skip-version-file: "true"
          output-file: "false"
          skip-commit: "true"
          skip-on-empty: "true"
          skip-tag: "true"

      - name: Create Release
        run: gh release create "$TAG_NAME" --notes "$BODY"
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.changelog.outputs.tag }}
          BODY: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Output
        id: output_step
        run: |
          echo "skipped=${{ steps.changelog.outputs.skipped }}" >> $GITHUB_OUTPUT
          echo "version=${{ steps.changelog.outputs.version }}" >> $GITHUB_OUTPUT

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - release
    if: ${{ needs.release.outputs.skipped == 'false' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/sandro-cois-bot:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/sandro-cois-bot:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - docker
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Prepare SSH config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf 'Host sandro-cois\n  HostName %s\n  User %s\n  Port %s\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" > ~/.ssh/config
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts ~/.ssh/id_ed25519

      - name: Deploy
        run: |
          rsync -avzr deploy.sh sandro-cois:/apps/sandro-cois/
          ssh sandro-cois sh /apps/sandro-cois/deploy.sh
